<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Прикроватный монитор пациента Mindray uMEC12 — технический чертёж">
  <title>Прикроватный монитор пациента Mindray uMEC12</title>
  <!-- Чертёжная сетка -->
  <g stroke="#E4EEF5" stroke-width="0.8">
    <path d="M0 25H400M0 50H400M0 75H400M0 100H400M0 125H400M0 150H400M0 175H400M0 200H400M0 225H400M0 250H400M0 275H400M0 300H400M0 325H400M0 350H400M0 375H400"/>
    <path d="M25 0V400M50 0V400M75 0V400M100 0V400M125 0V400M150 0V400M175 0V400M200 0V400M225 0V400M250 0V400M275 0V400M300 0V400M325 0V400M350 0V400M375 0V400"/>
  </g>
  <!-- Кроп-марки -->
  <g stroke="#E55220" stroke-width="2" fill="none">
    <path d="M14 26V14H26M374 14H386V26M386 374V386H374M26 386H14V374"/>
  </g>
  <text x="386" y="34" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#6C93AE">UMEC12</text>

  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Стойка: основание с колёсами -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <path d="M120 341 158 322H242L280 341Z"/>
      <circle cx="132" cy="349" r="8"/>
      <circle cx="200" cy="352" r="8"/>
      <circle cx="268" cy="349" r="8"/>
    </g>
    <!-- Колонна с регулировкой высоты -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="193" y="212" width="14" height="110" rx="3"/>
    </g>
    <g stroke="#6C93AE" stroke-width="1.5">
      <path d="M196 232H204M196 244H204M196 256H204"/>
    </g>
    <!-- Корпус монитора -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="118" y="84" width="164" height="122" rx="8"/>
      <!-- Ручка сверху -->
      <path d="M168 84V74a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v10"/>
    </g>
    <!-- Экран -->
    <rect x="130" y="96" width="118" height="98" rx="3" fill="#EAF3F8" stroke="#123B55" stroke-width="2"/>
    <!-- Кривые: ЭКГ (оранжевая) + плетизмограмма + НИАД -->
    <path d="M136 120h18l5-12 7 24 6-12h12l4-8 6 16 5-8h21" fill="none" stroke="#E55220" stroke-width="2"/>
    <path d="M136 150c8-10 14-10 22 0s14 10 22 0 14-10 22 0 14 10 22 0" fill="none" stroke="#6C93AE" stroke-width="1.5"/>
    <path d="M136 176h16v-6h10v6h20v-4h10v4h30" fill="none" stroke="#6C93AE" stroke-width="1.5"/>
    <!-- Колонка кнопок справа от экрана -->
    <g fill="#FFFFFF" stroke="#6C93AE" stroke-width="1.5">
      <rect x="256" y="100" width="16" height="10" rx="2"/>
      <rect x="256" y="118" width="16" height="10" rx="2"/>
      <rect x="256" y="136" width="16" height="10" rx="2"/>
      <circle cx="264" cy="172" r="9"/>
    </g>
    <!-- Разъёмы датчиков слева на корпусе -->
    <g stroke="#123B55" stroke-width="2" fill="#FFFFFF">
      <path d="M118 150h-10M118 166h-10"/>
      <circle cx="104" cy="150" r="4"/>
      <circle cx="104" cy="166" r="4"/>
    </g>
    <!-- Кабель датчика -->
    <path d="M104 170c-14 26-2 40 14 54s10 34-14 40" fill="none" stroke="#6C93AE" stroke-width="1.5"/>
  </g>

  <!-- Линия пола со штриховкой -->
  <g stroke="#123B55" stroke-width="1.5">
    <path d="M84 360H316"/>
  </g>
  <g stroke="#6C93AE" stroke-width="1">
    <path d="M96 360l-8 9M126 360l-8 9M156 360l-8 9M186 360l-8 9M216 360l-8 9M246 360l-8 9M276 360l-8 9M306 360l-8 9"/>
  </g>

  <!-- Выноска: экран -->
  <g fill="none" stroke="#C44217" stroke-width="1.3">
    <path d="M246 108c26-14 60-16 84-10"/>
    <circle cx="244" cy="109" r="2.4" fill="#C44217"/>
  </g>
  <text x="334" y="92" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#C44217">ЭКГ/SpO2</text>

  <!-- Размерная линия высоты -->
  <g stroke="#6C93AE" stroke-width="1">
    <path d="M66 84v273M60 84h12M60 357h12"/>
  </g>
  <text x="52" y="230" transform="rotate(-90 52 230)" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#6C93AE">H 1450</text>
</svg>
