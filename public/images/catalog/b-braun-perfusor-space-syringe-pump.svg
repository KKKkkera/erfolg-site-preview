    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="92" y="216" width="216" height="68" rx="6"/>
    </g>
    <!-- Шприц в направляющей нижнего насоса -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2">
      <rect x="112" y="234" width="104" height="18" rx="4"/>
      <path d="M216 238h12v10h-12M228 240h8v6h-8"/>
      <path d="M112 243H96"/>
      <rect x="104" y="230" width="8" height="26" rx="2"/>
