  </g>

  <g stroke="#123B55" stroke-width="1.5"><path d="M52 352H326"/></g>
  <g stroke="#6C93AE" stroke-width="1">
    <path d="M64 352l-8 9M94 352l-8 9M124 352l-8 9M154 352l-8 9M184 352l-8 9M214 352l-8 9M244 352l-8 9M274 352l-8 9M304 352l-8 9"/>
  </g>

  <!-- Выноска: стыкуемые модули -->
  <g fill="none" stroke="#C44217" stroke-width="1.3">
    <path d="M310 224c18-4 34-2 46 4"/>
    <circle cx="308" cy="225" r="2.4" fill="#C44217"/>
  </g>
  <text x="344" y="212" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#C44217">СТЫКОВКА</text>

  <g stroke="#6C93AE" stroke-width="1">
    <path d="M92 132v-8M308 132v-8M92 128h216"/>
  </g>
  <text x="200" y="118" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#6C93AE">W 249</text>
</svg>
