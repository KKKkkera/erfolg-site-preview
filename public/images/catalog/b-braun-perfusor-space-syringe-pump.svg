    <g stroke="#6C93AE" stroke-width="1.2">
      <path d="M126 234v18M140 234v18M154 234v18M168 234v18"/>
    </g>
    <!-- Дисплей и кнопки нижнего насоса -->
    <rect x="246" y="228" width="48" height="20" rx="3" fill="#EAF3F8" stroke="#123B55" stroke-width="2"/>
    <text x="270" y="242" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="10" fill="#123B55">12.5</text>
    <g fill="#FFFFFF" stroke="#6C93AE" stroke-width="1.4">
      <circle cx="256" cy="266" r="7"/>
      <circle cx="278" cy="266" r="7"/>
      <rect x="120" y="260" width="60" height="12" rx="3"/>
    </g>
    <!-- Насос 1 (верхний в стопке) -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="92" y="148" width="216" height="68" rx="6"/>
    </g>
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2">
      <rect x="112" y="166" width="104" height="18" rx="4"/>
      <path d="M216 170h12v10h-12M228 172h8v6h-8"/>
      <path d="M112 175H96"/>
      <rect x="104" y="162" width="8" height="26" rx="2"/>
    </g>
    <g stroke="#6C93AE" stroke-width="1.2">
      <path d="M126 166v18M140 166v18M154 166v18M168 166v18"/>
    </g>
    <rect x="246" y="160" width="48" height="20" rx="3" fill="#EAF3F8" stroke="#123B55" stroke-width="2"/>
    <path d="M250 170h6l3-6 4 12 3-6h24" fill="none" stroke="#E55220" stroke-width="1.6"/>
    <g fill="#FFFFFF" stroke="#6C93AE" stroke-width="1.4">
      <circle cx="256" cy="198" r="7"/>
      <circle cx="278" cy="198" r="7"/>
      <rect x="120" y="192" width="60" height="12" rx="3"/>
    </g>
