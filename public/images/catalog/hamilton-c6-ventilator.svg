      <rect x="286" y="252" width="34" height="30" rx="4"/>
      <path d="M292 262h22M292 270h22" stroke="#6C93AE" stroke-width="1.3"/>
    </g>
    <path d="M284 268h-0" stroke="#123B55" stroke-width="2"/>
  </g>

  <g stroke="#123B55" stroke-width="1.5"><path d="M96 362H332"/></g>
  <g stroke="#6C93AE" stroke-width="1">
    <path d="M108 362l-8 9M138 362l-8 9M168 362l-8 9M198 362l-8 9M228 362l-8 9M258 362l-8 9M288 362l-8 9M318 362l-8 9"/>
