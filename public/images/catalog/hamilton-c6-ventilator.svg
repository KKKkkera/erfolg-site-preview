    <!-- Корпус вентиляционного блока -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="176" y="216" width="108" height="114" rx="8"/>
    </g>
    <g stroke="#6C93AE" stroke-width="1.5" fill="none">
      <path d="M188 240h84M188 254h84"/>
      <circle cx="200" cy="304" r="10"/>
      <circle cx="230" cy="304" r="10"/>
      <rect x="252" y="296" width="20" height="16" rx="2"/>
    </g>
    <!-- Колонна к монитору -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="222" y="150" width="14" height="66" rx="3"/>
    </g>
    <!-- Кронштейн монитора -->
    <path d="M222 160H162v-14" fill="none" stroke="#123B55" stroke-width="2.5"/>
    <!-- Сенсорный монитор -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="96" y="62" width="132" height="86" rx="7"/>
    </g>
    <rect x="106" y="72" width="112" height="66" rx="3" fill="#EAF3F8" stroke="#123B55" stroke-width="2"/>
    <!-- Кривые давления/потока -->
    <path d="M112 94c6-14 10-14 14 0 3 11 6 12 10 2l4-10c4-10 8-10 12 0l4 10c4 10 7 9 10-2 4-14 8-14 14 0" fill="none" stroke="#E55220" stroke-width="2"/>
    <path d="M112 122h10v-8h14v8h12v-8h14v8h12v-8h14v8h12" fill="none" stroke="#6C93AE" stroke-width="1.5"/>
    <!-- Дыхательный контур: гофрированный шланг от блока к плечу пациента -->
    <path d="M176 262c-30 0-44 8-52 24-7 14-8 34-4 50" fill="none" stroke="#123B55" stroke-width="2.5"/>
    <g stroke="#6C93AE" stroke-width="1.3">
      <path d="M168 258l-4 10M158 261l-4 10M149 267l-4 10M142 276l-4 10M137 287l-3 10M134 299l-2 10M133 311l-1 10M133 323l0 10"/>
    </g>
