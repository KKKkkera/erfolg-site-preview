  </g>
  <text x="386" y="34" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#6C93AE">C6</text>

  <g stroke-linejoin="round" stroke-linecap="round">
