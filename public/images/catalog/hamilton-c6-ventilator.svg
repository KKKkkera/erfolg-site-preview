  <text x="352" y="212" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#C44217">ТУРБИНА</text>

  <g stroke="#6C93AE" stroke-width="1">
    <path d="M66 62v297M60 62h12M60 359h12"/>
  </g>
  <text x="52" y="212" transform="rotate(-90 52 212)" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#6C93AE">H 1350</text>
</svg>
