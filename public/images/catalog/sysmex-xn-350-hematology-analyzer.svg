    <g stroke="#6C93AE" stroke-width="1.4">
      <path d="M170 100v-8M180 100v-13M190 100v-6M200 100v-11"/>
    </g>
    <path d="M212 88c6 8 14 10 22 8" fill="none" stroke="#E55220" stroke-width="1.8"/>
    <!-- Зона пробы: открытый порт с пробиркой -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2">
      <rect x="222" y="180" width="34" height="58" rx="5"/>
    </g>
    <g fill="#EAF3F8" stroke="#123B55" stroke-width="1.8">
      <path d="M234 192h10v30a5 5 0 0 1-10 0Z"/>
    </g>
    <path d="M234 204h10" stroke="#E55220" stroke-width="1.8"/>
