    <path d="M239 180v-16" stroke="#123B55" stroke-width="2"/>
    <path d="M235 164h8" stroke="#123B55" stroke-width="2"/>
    <!-- Панель статуса слева -->
    <g fill="#FFFFFF" stroke="#6C93AE" stroke-width="1.4">
      <rect x="132" y="150" width="64" height="10" rx="2"/>
      <rect x="132" y="168" width="64" height="10" rx="2"/>
    </g>
    <circle cx="140" cy="196" r="4" fill="#E55220" stroke="none"/>
    <text x="150" y="200" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="10" fill="#6C93AE">READY</text>
    <!-- Вентиляционные прорези -->
    <g stroke="#6C93AE" stroke-width="1.2">
      <path d="M132 262h44M132 270h44M132 278h44"/>
    </g>
    <!-- Кнопка старта -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2">
      <circle cx="239" cy="262" r="11"/>
    </g>
    <circle cx="239" cy="262" r="4.5" fill="#EAF3F8" stroke="#6C93AE" stroke-width="1.2"/>
    <!-- Штатив с пробирками рядом -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2">
      <rect x="296" y="266" width="58" height="32" rx="4"/>
    </g>
    <g fill="#EAF3F8" stroke="#123B55" stroke-width="1.6">
      <path d="M304 274h8v18a4 4 0 0 1-8 0ZM318 274h8v18a4 4 0 0 1-8 0ZM332 274h8v18a4 4 0 0 1-8 0Z"/>
    </g>
    <g stroke="#E55220" stroke-width="1.4">
      <path d="M304 282h8M318 282h8M332 282h8"/>
