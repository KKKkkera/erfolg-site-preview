  <!-- Линия стола -->
  <g stroke="#123B55" stroke-width="1.5"><path d="M72 328H368"/></g>
  <g stroke="#6C93AE" stroke-width="1">
    <path d="M84 328l-8 9M114 328l-8 9M144 328l-8 9M174 328l-8 9M204 328l-8 9M234 328l-8 9M264 328l-8 9M294 328l-8 9M324 328l-8 9M354 328l-8 9"/>
