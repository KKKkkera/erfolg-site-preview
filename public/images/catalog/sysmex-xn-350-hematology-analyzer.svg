    <!-- Наклонный сенсорный экран сверху -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <path d="M126 112 150 74h94l14 38Z"/>
    </g>
    <path d="M138 106 156 80h82l10 26Z" fill="#EAF3F8" stroke="#123B55" stroke-width="2"/>
