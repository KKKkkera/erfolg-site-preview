  <!-- Выноска: порт пробы -->
  <g fill="none" stroke="#C44217" stroke-width="1.3">
    <path d="M258 196c26-8 52-6 72 2"/>
    <circle cx="256" cy="197" r="2.4" fill="#C44217"/>
  </g>
  <text x="336" y="184" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#C44217">ПРОБА 25 МКЛ</text>

  <g stroke="#6C93AE" stroke-width="1">
    <path d="M86 74v251M80 74h12M80 325h12"/>
  </g>
  <text x="72" y="200" transform="rotate(-90 72 200)" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#6C93AE">H 480</text>
</svg>
