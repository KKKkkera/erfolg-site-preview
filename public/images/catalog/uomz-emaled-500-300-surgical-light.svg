<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Операционный светильник Эмалед 500/300 — технический чертёж">
  <title>Операционный светильник Эмалед 500/300</title>
  <g stroke="#E4EEF5" stroke-width="0.8">
    <path d="M0 25H400M0 50H400M0 75H400M0 100H400M0 125H400M0 150H400M0 175H400M0 200H400M0 225H400M0 250H400M0 275H400M0 300H400M0 325H400M0 350H400M0 375H400"/>
    <path d="M25 0V400M50 0V400M75 0V400M100 0V400M125 0V400M150 0V400M175 0V400M200 0V400M225 0V400M250 0V400M275 0V400M300 0V400M325 0V400M350 0V400M375 0V400"/>
  </g>
  <g stroke="#E55220" stroke-width="2" fill="none">
    <path d="M14 26V14H26M374 14H386V26M386 374V386H374M26 386H14V374"/>
  </g>
  <text x="386" y="382" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#6C93AE">500/300</text>

  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Потолочное крепление -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <path d="M148 36H252"/>
      <rect x="186" y="36" width="28" height="22" rx="4"/>
      <rect x="194" y="58" width="12" height="34" rx="3"/>
    </g>
    <g stroke="#6C93AE" stroke-width="1">
      <path d="M156 36l-7-8M176 36l-7-8M196 36l-7-8M216 36l-7-8M236 36l-7-8M251 36l-7-8"/>
    </g>
    <!-- Центральная ось с траверсой -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <circle cx="200" cy="102" r="12"/>
      <path d="M192 110 116 158M209 110 286 150"/>
    </g>
    <!-- Пружинное плечо к большому куполу -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <path d="M116 158l-8 44"/>
      <circle cx="116" cy="158" r="7"/>
    </g>
    <!-- Большой купол (500) -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <ellipse cx="132" cy="242" rx="76" ry="34"/>
      <path d="M108 202l24 8"/>
    </g>
    <!-- LED-сегменты большого купола -->
    <g stroke="#6C93AE" stroke-width="1.4" fill="#FFFFFF">
      <ellipse cx="132" cy="244" rx="58" ry="24"/>
      <circle cx="132" cy="244" r="9"/>
      <circle cx="98" cy="240" r="7"/>
      <circle cx="166" cy="240" r="7"/>
      <circle cx="115" cy="254" r="7"/>
      <circle cx="149" cy="254" r="7"/>
      <circle cx="115" cy="231" r="7"/>
      <circle cx="149" cy="231" r="7"/>
    </g>
    <!-- Рукоятка большого купола -->
    <path d="M126 276h12v10a6 6 0 0 1-12 0Z" fill="#FFFFFF" stroke="#123B55" stroke-width="2"/>
    <!-- Плечо к малому куполу -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <path d="M286 150l6 38"/>
      <circle cx="286" cy="150" r="7"/>
    </g>
    <!-- Малый купол (300) -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <ellipse cx="288" cy="216" rx="52" ry="24"/>
      <path d="M278 188l14 4"/>
    </g>
    <g stroke="#6C93AE" stroke-width="1.4" fill="#FFFFFF">
      <ellipse cx="288" cy="218" rx="38" ry="16"/>
      <circle cx="288" cy="218" r="7"/>
      <circle cx="264" cy="216" r="6"/>
      <circle cx="312" cy="216" r="6"/>
    </g>
    <path d="M282 240h12v9a6 6 0 0 1-12 0Z" fill="#FFFFFF" stroke="#123B55" stroke-width="2"/>
    <!-- Световые конусы -->
    <g stroke="#E55220" stroke-width="1.2" fill="none" stroke-dasharray="5 6">
      <path d="M76 270 60 330M188 270l16 60M244 236l-14 74M332 236l16 74"/>
    </g>
    <!-- Операционное поле -->
    <path d="M96 336h116M262 322h100" stroke="#E55220" stroke-width="2" fill="none"/>
  </g>

  <!-- Выноска: сегменты LED -->
  <g fill="none" stroke="#C44217" stroke-width="1.3">
    <path d="M162 232c30-24 62-58 76-104"/>
    <circle cx="160" cy="233" r="2.4" fill="#C44217"/>
  </g>
  <text x="252" y="118" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#C44217">LED 160 000 ЛК</text>

  <!-- Размерная линия диаметра большого купола -->
  <g stroke="#6C93AE" stroke-width="1">
    <path d="M56 288 208 288M56 282v12M208 282v12"/>
  </g>
  <text x="132" y="304" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#6C93AE">Ø 500</text>
</svg>
