<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Биохимический анализатор Roche cobas c111 — технический чертёж">
  <title>Биохимический анализатор Roche cobas c111</title>
  <g stroke="#E4EEF5" stroke-width="0.8">
    <path d="M0 25H400M0 50H400M0 75H400M0 100H400M0 125H400M0 150H400M0 175H400M0 200H400M0 225H400M0 250H400M0 275H400M0 300H400M0 325H400M0 350H400M0 375H400"/>
    <path d="M25 0V400M50 0V400M75 0V400M100 0V400M125 0V400M150 0V400M175 0V400M200 0V400M225 0V400M250 0V400M275 0V400M300 0V400M325 0V400M350 0V400M375 0V400"/>
  </g>
  <g stroke="#E55220" stroke-width="2" fill="none">
    <path d="M14 26V14H26M374 14H386V26M386 374V386H374M26 386H14V374"/>
  </g>
  <text x="386" y="34" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#6C93AE">C111</text>

  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Корпус настольного анализатора -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <path d="M96 150a10 10 0 0 1 10-10h188a10 10 0 0 1 10 10v150H96Z"/>
      <path d="M96 300h208l12 20H84Z"/>
    </g>
    <!-- Откинутая верхняя крышка с ротором -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <path d="M118 140 134 96h132l16 44"/>
    </g>
    <!-- Ротор с кюветами (вид сверху на наклонной проекции) -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2">
      <ellipse cx="200" cy="122" rx="52" ry="17"/>
      <ellipse cx="200" cy="122" rx="20" ry="6.5"/>
    </g>
    <!-- Сегменты-кюветы по кольцу -->
    <g stroke="#6C93AE" stroke-width="1.2">
      <path d="M200 105v6M226 108l-3 5M246 115l-5 4M251 122h-6M246 129l-5-4M226 136l-3-5M200 133v6M174 136l3-5M154 129l5-4M149 122h6M154 115l5 4M174 108l3 5"/>
    </g>
    <circle cx="238" cy="118" r="3" fill="#E55220" stroke="none"/>
    <!-- Манипулятор над ротором -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2">
      <path d="M264 96V78h-36"/>
      <path d="M228 78v14"/>
    </g>
    <!-- Дисплей на фронте справа -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <path d="M236 162h56l6 10v34h-62Z"/>
    </g>
    <rect x="242" y="170" width="48" height="28" rx="2" fill="#EAF3F8" stroke="#123B55" stroke-width="1.8"/>
    <path d="M248 188h8v-8h6v8h8v-5h6v5h10" fill="none" stroke="#E55220" stroke-width="1.6"/>
    <!-- Клавиши под дисплеем -->
    <g fill="#FFFFFF" stroke="#6C93AE" stroke-width="1.4">
      <rect x="242" y="214" width="14" height="10" rx="2"/>
      <rect x="262" y="214" width="14" height="10" rx="2"/>
      <rect x="282" y="214" width="14" height="10" rx="2"/>
    </g>
    <!-- Зона проб слева: выдвижной штатив -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2">
      <rect x="112" y="170" width="104" height="52" rx="5"/>
    </g>
    <g fill="#EAF3F8" stroke="#123B55" stroke-width="1.6">
      <circle cx="130" cy="186" r="7"/>
      <circle cx="152" cy="186" r="7"/>
      <circle cx="174" cy="186" r="7"/>
      <circle cx="196" cy="186" r="7"/>
      <circle cx="130" cy="206" r="7"/>
      <circle cx="152" cy="206" r="7"/>
      <circle cx="174" cy="206" r="7"/>
      <circle cx="196" cy="206" r="7"/>
    </g>
    <!-- Индикатор и вентиляция -->
    <circle cx="120" cy="244" r="4" fill="#E55220" stroke="none"/>
    <text x="130" y="248" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="10" fill="#6C93AE">RUN</text>
    <g stroke="#6C93AE" stroke-width="1.2">
      <path d="M112 264h64M112 272h64M112 280h64"/>
    </g>
    <!-- Порт реагентов -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2">
      <rect x="236" y="248" width="62" height="34" rx="5"/>
      <path d="M244 265h46" stroke="#6C93AE" stroke-width="1.4"/>
    </g>
  </g>

  <!-- Линия стола -->
  <g stroke="#123B55" stroke-width="1.5"><path d="M64 328H352"/></g>
  <g stroke="#6C93AE" stroke-width="1">
    <path d="M76 328l-8 9M106 328l-8 9M136 328l-8 9M166 328l-8 9M196 328l-8 9M226 328l-8 9M256 328l-8 9M286 328l-8 9M316 328l-8 9M346 328l-8 9"/>
  </g>

  <!-- Выноска: ротор -->
  <g fill="none" stroke="#C44217" stroke-width="1.3">
    <path d="M254 112c30-14 60-18 86-14"/>
    <circle cx="252" cy="113" r="2.4" fill="#C44217"/>
  </g>
  <text x="340" y="86" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#C44217">РОТОР</text>

  <g stroke="#6C93AE" stroke-width="1">
    <path d="M96 344v6M304 344v6M96 347h208"/>
  </g>
  <text x="200" y="364" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#6C93AE">W 590</text>
</svg>
