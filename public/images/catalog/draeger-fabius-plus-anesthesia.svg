<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Наркозно-дыхательный аппарат Dräger Fabius plus — технический чертёж">
  <title>Наркозно-дыхательный аппарат Dräger Fabius plus</title>
  <g stroke="#E4EEF5" stroke-width="0.8">
    <path d="M0 25H400M0 50H400M0 75H400M0 100H400M0 125H400M0 150H400M0 175H400M0 200H400M0 225H400M0 250H400M0 275H400M0 300H400M0 325H400M0 350H400M0 375H400"/>
    <path d="M25 0V400M50 0V400M75 0V400M100 0V400M125 0V400M150 0V400M175 0V400M200 0V400M225 0V400M250 0V400M275 0V400M300 0V400M325 0V400M350 0V400M375 0V400"/>
  </g>
  <g stroke="#E55220" stroke-width="2" fill="none">
    <path d="M14 26V14H26M374 14H386V26M386 374V386H374M26 386H14V374"/>
  </g>
  <text x="386" y="34" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#6C93AE">FABIUS</text>

  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- Рама с верхней полкой -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="108" y="64" width="184" height="16" rx="4"/>
      <path d="M120 80v240M280 80v240"/>
    </g>
    <!-- Дисплей вентилятора (слева на раме) -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="86" y="106" width="96" height="72" rx="6"/>
    </g>
    <rect x="94" y="114" width="80" height="48" rx="3" fill="#EAF3F8" stroke="#123B55" stroke-width="2"/>
    <path d="M100 144c5-16 8-16 12 0 3 12 6 12 9 0 4-16 7-16 12 0 3 12 6 12 9 0 4-16 7-16 12 0" fill="none" stroke="#E55220" stroke-width="1.8"/>
    <g fill="#FFFFFF" stroke="#6C93AE" stroke-width="1.4">
      <circle cx="106" cy="170" r="4"/><circle cx="122" cy="170" r="4"/><circle cx="138" cy="170" r="4"/>
    </g>
    <!-- Ротаметры (флоуметры) по центру -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2">
      <rect x="196" y="100" width="14" height="58" rx="3"/>
      <rect x="216" y="100" width="14" height="58" rx="3"/>
    </g>
    <g stroke="#6C93AE" stroke-width="1.1">
      <path d="M199 110h8M199 122h8M199 134h8M199 146h8M219 110h8M219 122h8M219 134h8M219 146h8"/>
    </g>
    <circle cx="203" cy="140" r="3" fill="#E55220" stroke="none"/>
    <circle cx="223" cy="126" r="3" fill="#E55220" stroke="none"/>
    <!-- Испарители справа -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="240" y="104" width="34" height="54" rx="5"/>
    </g>
    <g stroke="#6C93AE" stroke-width="1.4">
      <circle cx="257" cy="120" r="9" fill="#FFFFFF"/>
      <path d="M257 120 263 113"/>
      <path d="M246 142h22M246 150h14"/>
    </g>
    <!-- Стол-полка -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="112" y="196" width="176" height="12" rx="3"/>
    </g>
    <!-- Дыхательный модуль с мешком -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="128" y="222" width="70" height="54" rx="6"/>
    </g>
    <g stroke="#6C93AE" stroke-width="1.4">
      <circle cx="150" cy="242" r="10" fill="#FFFFFF"/>
      <circle cx="178" cy="242" r="6" fill="#FFFFFF"/>
      <path d="M136 264h48"/>
    </g>
    <!-- Дыхательный мешок -->
    <path d="M214 224v10c0 4 3 6 6 8-8 8-12 18-12 28 0 14 8 24 18 24s18-10 18-24c0-10-4-20-12-28 3-2 6-4 6-8v-10" fill="#FFFFFF" stroke="#123B55" stroke-width="2.2"/>
    <!-- Ящики -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <rect x="128" y="288" width="144" height="34" rx="5"/>
    </g>
    <path d="M186 305h28" stroke="#6C93AE" stroke-width="1.5"/>
    <!-- Основание с колёсами -->
    <g fill="#FFFFFF" stroke="#123B55" stroke-width="2.5">
      <path d="M104 322H296"/>
      <circle cx="126" cy="336" r="10"/>
      <circle cx="274" cy="336" r="10"/>
      <circle cx="126" cy="336" r="3.5" stroke="#6C93AE" stroke-width="1.4"/>
      <circle cx="274" cy="336" r="3.5" stroke="#6C93AE" stroke-width="1.4"/>
    </g>
    <!-- Шланг подачи к пациенту -->
    <path d="M292 210c26 6 38 22 38 44" fill="none" stroke="#6C93AE" stroke-width="1.5"/>
  </g>

  <g stroke="#123B55" stroke-width="1.5"><path d="M84 354H316"/></g>
  <g stroke="#6C93AE" stroke-width="1">
    <path d="M96 354l-8 9M126 354l-8 9M156 354l-8 9M186 354l-8 9M216 354l-8 9M246 354l-8 9M276 354l-8 9M306 354l-8 9"/>
  </g>

  <!-- Выноска: испарители -->
  <g fill="none" stroke="#C44217" stroke-width="1.3">
    <path d="M276 110c22-12 46-16 68-12"/>
    <circle cx="274" cy="111" r="2.4" fill="#C44217"/>
  </g>
  <text x="344" y="86" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" fill="#C44217">ИСПАРИТЕЛЬ</text>

  <g stroke="#6C93AE" stroke-width="1">
    <path d="M62 64v287M56 64h12M56 351h12"/>
  </g>
  <text x="48" y="208" transform="rotate(-90 48 208)" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#6C93AE">H 1400</text>
</svg>
