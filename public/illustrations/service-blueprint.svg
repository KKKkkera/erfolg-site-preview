<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Технический чертёж и инструменты для обслуживания медицинского оборудования">
  <defs>
    <pattern id="svc-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
    <pattern id="svc-grid-fine" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#039FE4" stroke-width="0.3" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1000" height="700" fill="#FFFFFF"/>
  <rect width="1000" height="700" fill="#F8FAFC"/>
  <rect width="1000" height="700" fill="url(#svc-grid)"/>
  <rect width="1000" height="700" fill="url(#svc-grid-fine)"/>

  <!-- Top tag -->
  <g font-family="ui-monospace, monospace" font-size="12" fill="#64748B" letter-spacing="2">
    <text x="40" y="40">FIG · 02 · TECHNICAL SERVICE</text>
    <line x1="40" y1="50" x2="960" y2="50" stroke="#CBD5E1"/>
    <text x="960" y="40" text-anchor="end">SHEET 1 / 1</text>
  </g>

  <!-- Schematic — exploded device view -->
  <g transform="translate(120 130)">
    <!-- Main module box -->
    <rect x="0" y="0" width="320" height="200" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="20" y="20" width="280" height="160" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
    <line x1="40" y1="50" x2="280" y2="50" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <line x1="40" y1="80" x2="280" y2="80" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <line x1="40" y1="110" x2="280" y2="110" stroke="#94A3B8" stroke-dasharray="3 3"/>
    <line x1="40" y1="140" x2="280" y2="140" stroke="#94A3B8" stroke-dasharray="3 3"/>

    <!-- Pins along the right edge -->
    <g fill="#039FE4">
      <rect x="320" y="40" width="14" height="6"/>
      <rect x="320" y="60" width="14" height="6"/>
      <rect x="320" y="80" width="14" height="6"/>
      <rect x="320" y="100" width="14" height="6"/>
      <rect x="320" y="120" width="14" height="6"/>
      <rect x="320" y="140" width="14" height="6"/>
    </g>

    <!-- Callouts -->
    <g font-family="ui-monospace, monospace" font-size="11" fill="#0F172A" letter-spacing="2">
      <line x1="-30" y1="40" x2="0" y2="40" stroke="#039FE4" stroke-width="1.5"/>
      <circle cx="-34" cy="40" r="10" fill="#FFFFFF" stroke="#039FE4" stroke-width="1.5"/>
      <text x="-34" y="44" text-anchor="middle" fill="#039FE4">A</text>
      <text x="-50" y="44" text-anchor="end" fill="#475569">PSU · 24V</text>

      <line x1="-30" y1="100" x2="0" y2="100" stroke="#039FE4" stroke-width="1.5"/>
      <circle cx="-34" cy="100" r="10" fill="#FFFFFF" stroke="#039FE4" stroke-width="1.5"/>
      <text x="-34" y="104" text-anchor="middle" fill="#039FE4">B</text>
      <text x="-50" y="104" text-anchor="end" fill="#475569">MAINBOARD</text>

      <line x1="-30" y1="160" x2="0" y2="160" stroke="#039FE4" stroke-width="1.5"/>
      <circle cx="-34" cy="160" r="10" fill="#FFFFFF" stroke="#039FE4" stroke-width="1.5"/>
      <text x="-34" y="164" text-anchor="middle" fill="#039FE4">C</text>
      <text x="-50" y="164" text-anchor="end" fill="#475569">SENSOR · ADC</text>
    </g>

    <!-- Dimensions -->
    <g stroke="#94A3B8" stroke-width="1">
      <line x1="0" y1="220" x2="320" y2="220"/>
      <line x1="0" y1="215" x2="0" y2="225"/>
      <line x1="320" y1="215" x2="320" y2="225"/>
    </g>
    <text x="160" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569" letter-spacing="2">320 mm</text>
  </g>

  <!-- Right side — exploded daughter board -->
  <g transform="translate(560 130)">
    <rect x="0" y="0" width="280" height="120" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <!-- IC chips -->
    <rect x="20" y="20" width="60" height="40" fill="#0F172A"/>
    <rect x="100" y="20" width="40" height="40" fill="#0F172A"/>
    <rect x="160" y="20" width="100" height="40" fill="#0F172A"/>
    <!-- Traces -->
    <g stroke="#039FE4" stroke-width="1.5" fill="none">
      <path d="M 80 40 L 100 40"/>
      <path d="M 140 40 L 160 40"/>
      <path d="M 50 60 L 50 100 L 230 100 L 230 60"/>
      <path d="M 120 60 L 120 80 L 200 80 L 200 60"/>
    </g>
    <!-- Label -->
    <text x="140" y="105" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#475569" letter-spacing="2">DAUGHTER · IO · v2.4</text>
  </g>

  <!-- Wrench tool icon (stylized) -->
  <g transform="translate(560 320)">
    <path d="M 0 30 L 60 30 A 12 12 0 0 1 60 54 L 0 54 Z M 80 42 m -22 0 a 22 22 0 1 0 44 0 a 22 22 0 1 0 -44 0 Z M 80 42 m -10 0 a 10 10 0 1 1 20 0 a 10 10 0 1 1 -20 0 Z"
          fill="#0F172A" fill-rule="evenodd"/>
    <text x="0" y="90" font-family="ui-monospace, monospace" font-size="11" fill="#475569" letter-spacing="2">SERVICE TOOLKIT</text>
  </g>

  <!-- Multimeter icon -->
  <g transform="translate(720 310)">
    <rect x="0" y="0" width="100" height="80" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="10" y="10" width="80" height="30" rx="2" fill="#0F172A"/>
    <text x="50" y="32" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="700" font-size="14" fill="#22D3EE">12.4 V</text>
    <circle cx="30" cy="60" r="5" fill="#DC2626"/>
    <circle cx="50" cy="60" r="5" fill="#0F172A"/>
    <circle cx="70" cy="60" r="5" fill="#16A34A"/>
    <text x="50" y="100" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#475569" letter-spacing="2">DIAGNOSTIC</text>
  </g>

  <!-- Bottom — checklist / process steps -->
  <g transform="translate(120 460)">
    <line x1="0" y1="0" x2="760" y2="0" stroke="#0F172A" stroke-width="2"/>
    <g font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">
      <!-- step 1 -->
      <circle cx="60" cy="40" r="18" fill="#039FE4"/>
      <text x="60" y="45" text-anchor="middle" fill="#FFFFFF" font-family="Manrope, sans-serif" font-weight="700" font-size="14">1</text>
      <text x="60" y="90" text-anchor="middle" fill="#0F172A">DIAGNOSE</text>
      <text x="60" y="108" text-anchor="middle" fill="#64748B">Inspection</text>

      <line x1="100" y1="40" x2="180" y2="40" stroke="#CBD5E1" stroke-dasharray="4 4"/>

      <!-- step 2 -->
      <circle cx="220" cy="40" r="18" fill="#FFFFFF" stroke="#039FE4" stroke-width="2"/>
      <text x="220" y="45" text-anchor="middle" fill="#039FE4" font-family="Manrope, sans-serif" font-weight="700" font-size="14">2</text>
      <text x="220" y="90" text-anchor="middle" fill="#0F172A">REPAIR</text>
      <text x="220" y="108" text-anchor="middle" fill="#64748B">Component swap</text>

      <line x1="260" y1="40" x2="340" y2="40" stroke="#CBD5E1" stroke-dasharray="4 4"/>

      <!-- step 3 -->
      <circle cx="380" cy="40" r="18" fill="#FFFFFF" stroke="#039FE4" stroke-width="2"/>
      <text x="380" y="45" text-anchor="middle" fill="#039FE4" font-family="Manrope, sans-serif" font-weight="700" font-size="14">3</text>
      <text x="380" y="90" text-anchor="middle" fill="#0F172A">CALIBRATE</text>
      <text x="380" y="108" text-anchor="middle" fill="#64748B">Verification</text>

      <line x1="420" y1="40" x2="500" y2="40" stroke="#CBD5E1" stroke-dasharray="4 4"/>

      <!-- step 4 -->
      <circle cx="540" cy="40" r="18" fill="#FFFFFF" stroke="#039FE4" stroke-width="2"/>
      <text x="540" y="45" text-anchor="middle" fill="#039FE4" font-family="Manrope, sans-serif" font-weight="700" font-size="14">4</text>
      <text x="540" y="90" text-anchor="middle" fill="#0F172A">TEST</text>
      <text x="540" y="108" text-anchor="middle" fill="#64748B">QC pass</text>

      <line x1="580" y1="40" x2="660" y2="40" stroke="#CBD5E1" stroke-dasharray="4 4"/>

      <!-- step 5 -->
      <circle cx="700" cy="40" r="18" fill="#16A34A"/>
      <path d="M 692 40 L 698 46 L 710 34" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="700" y="90" text-anchor="middle" fill="#0F172A">DELIVER</text>
      <text x="700" y="108" text-anchor="middle" fill="#64748B">Sign-off</text>
    </g>
  </g>

  <!-- Bottom strip -->
  <g>
    <line x1="40" y1="640" x2="960" y2="640" stroke="#E2E8F0"/>
    <text x="40" y="668" font-family="ui-monospace, monospace" font-size="12" fill="#0F172A" letter-spacing="3">ERFOLG · TECHNICAL SERVICE</text>
    <text x="960" y="668" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#64748B" letter-spacing="2">ROSZDRAVNADZOR LICENSED · ON-SITE & WORKSHOP</text>
  </g>
</svg>
