# nginx перед приложением. Устанавливается как
# /etc/nginx/sites-available/erfolg, симлинк в sites-enabled.
#
# TLS-строки ниже дописывает certbot (--nginx) при выпуске сертификата.

# Сертификат: certbot --nginx -d erfolgmt.ru -d www.erfolgmt.ru

server {
    listen 80;
    listen [::]:80;
    server_name erfolgmt.ru www.erfolgmt.ru;

    # ACME-проверка должна проходить по http, остальное — на https.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://erfolgmt.ru$request_uri; }
}

# www → без www, одним 301: две версии домена в индексе — это дубли.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.erfolgmt.ru;

    ssl_certificate     /etc/letsencrypt/live/erfolgmt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erfolgmt.ru/privkey.pem;

    return 301 https://erfolgmt.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erfolgmt.ru;

    ssl_certificate     /etc/letsencrypt/live/erfolgmt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erfolgmt.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Загрузка картинок в админку и вложений к заявкам.
    client_max_body_size 32m;

    # Заголовки безопасности приложение выставляет само (next.config.mjs),
    # здесь их дублировать не нужно — получились бы двойные значения.

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Статика сборки неизменяема: имя файла содержит хеш.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # $remote_addr, а не $proxy_add_x_forwarded_for: приложение доверяет
        # первому значению в X-Forwarded-For (TRUST_PROXY=true), и клиент
        # может прислать свой заголовок, подделав IP для rate-limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
